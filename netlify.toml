[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route is served by index.html so deep links
# (e.g. /deal/tabby) resolve client-side. Mirrors public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
